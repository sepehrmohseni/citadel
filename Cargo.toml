[workspace]
resolver = "3"
members = ["crates/*", "app/src-tauri"]
default-members = ["crates/*"]
exclude = ["crates/citadel-guard"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sepehrmohseni/citadel"
homepage = "https://sepehrmohseni.github.io/citadel/"
keywords = ["ssh", "tunnel", "sftp", "vault", "terminal"]
categories = ["network-programming", "cryptography", "command-line-utilities"]

[workspace.dependencies]
citadel-vault = { path = "crates/citadel-vault", version = "0.1.0" }
citadel-ssh = { path = "crates/citadel-ssh", version = "0.1.0" }
citadel-telemetry = { path = "crates/citadel-telemetry", version = "0.1.0" }
citadel-config = { path = "crates/citadel-config", version = "0.1.0" }
citadel-sync = { path = "crates/citadel-sync", version = "0.1.0" }
citadel-testkit = { path = "crates/citadel-testkit" }

argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
getrandom = { version = "0.3", features = ["std"] }
redb = "4.4"
rmp-serde = "1.3"
ruzstd = { version = "0.8", default-features = false, features = ["std"] }
secrecy = "0.10"
zeroize = { version = "1.8", features = ["derive", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
hex = "0.4"
rand = "0.10"

russh = { version = "0.64", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "3.0"
tokio = { version = "1.47", default-features = false }
tokio-util = { version = "0.7", default-features = false }
bytes = "1.10"
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std"] }

reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rusty-s3 = "0.10"
url = "2.5"
base64 = "0.22"

dirs = "6"
tempfile = "3.20"
libc = "0.2"

tauri = { version = "2.12", features = [] }
tauri-build = { version = "2.7", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-clipboard-manager = "=2.4.1"
tauri-plugin-global-shortcut = "=2.3.2"
tauri-plugin-opener = "=2.7.0"
fontdb = "0.24"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"
large_futures = "warn"
needless_pass_by_value = "warn"
redundant_clone = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
debug = false
incremental = false

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.dev.package.chacha20]
opt-level = 3

[profile.dev.package.poly1305]
opt-level = 3

[profile.dev.package.ruzstd]
opt-level = 3

[profile.dev.package.ring]
opt-level = 3
