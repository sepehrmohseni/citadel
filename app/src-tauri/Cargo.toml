[package]
name = "citadel-app"
description = "Citadel desktop application"
authors = ["Sepehr Mohseni <64346646+sepehrmohseni@users.noreply.github.com>"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lib]
name = "citadel_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
citadel-vault.workspace = true
citadel-ssh.workspace = true
citadel-telemetry.workspace = true
citadel-config.workspace = true
citadel-sync.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-clipboard-manager.workspace = true
tauri-plugin-opener.workspace = true
fontdb.workspace = true
serde.workspace = true
serde_json.workspace = true
secrecy.workspace = true
zeroize.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
futures.workspace = true
dirs.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt", "macros", "fs"] }

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut.workspace = true

[lints]
workspace = true
