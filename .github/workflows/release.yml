name: Release

# Tag push (v*): builds every installer without write access, signs the APK in
# its own job, then one publish job (which runs no build code) attaches every
# file plus SHA256SUMS to a draft release. Publish the draft by hand.
# Manual run (workflow_dispatch): same builds, results stay workflow artifacts.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  APK_CERT_SHA256: 73d60e8e634f8139367d2a93c43979735391c675a0c3c3f6fc646869b3c8967a

jobs:
  draft:
    name: draft release
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Tag matches app version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(jq -r .version app/src-tauri/tauri.conf.json)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match version $version in app/src-tauri/tauri.conf.json"
            exit 1
          fi
      - name: Release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          sed "s/@VERSION@/${TAG#v}/g" .github/release-notes.md > "$notes"
          gh api -X POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$TAG" --jq .body >> "$notes"
          echo "NOTES_FILE=$notes" >> "$GITHUB_ENV"
      - name: Create or reuse draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          state=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || true)
          case "$state" in
            true)
              echo "reusing existing draft release $TAG"
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$NOTES_FILE"
              ;;
            false)
              echo "::error::release $TAG is already published; refusing to replace its assets"
              exit 1
              ;;
            *)
              gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft \
                --title "Citadel $TAG" --notes-file "$NOTES_FILE" --verify-tag
              ;;
          esac

  bundle:
    name: bundle (${{ matrix.name }})
    needs: draft
    if: ${{ !cancelled() && (needs.draft.result == 'success' || needs.draft.result == 'skipped') }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
            args: --bundles deb,rpm,appimage
          - name: windows-x64
            os: windows-latest
            args: --bundles nsis,msi
          - name: macos-universal
            os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: System packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: release-${{ matrix.name }}
      - name: Install frontend dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Build installers
        working-directory: app
        run: pnpm tauri build ${{ matrix.args }} -- --locked
      - name: Collect installers
        run: scripts/collect-bundles.sh dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bundle-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  android:
    name: build (android)
    needs: draft
    if: ${{ !cancelled() && (needs.draft.result == 'success' || needs.draft.result == 'skipped') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 21
      - name: Android NDK
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -d "$ANDROID_HOME/ndk/$NDK_VERSION" ]; then
            (yes || true) | "$sdkmanager" --licenses > /dev/null
            "$sdkmanager" --install "ndk;$NDK_VERSION"
          fi
          test -d "$ANDROID_HOME/ndk/$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: release-android
      - name: Install frontend dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Build unsigned APK
        working-directory: app
        run: pnpm tauri android build --apk --target aarch64 armv7 x86_64 -- --locked
      - name: Collect unsigned APK
        run: |
          mkdir -p unsigned
          cp app/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk unsigned/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-unsigned
          path: unsigned/*
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  sign-android:
    name: sign (android)
    needs: android
    if: ${{ !cancelled() && needs.android.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: android-unsigned
          path: unsigned
      - name: Sign APK
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$PASSWORD" ]; then
            echo "::error::add the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD repository secrets (see docs/INSTALL.md)"
            exit 1
          fi
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          ks="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$ks"' EXIT
          printf '%s' "$KEYSTORE" | base64 -d > "$ks"
          in=unsigned/app-universal-release-unsigned.apk
          aligned="$RUNNER_TEMP/aligned.apk"
          if "$bt/zipalign" -c -P 16 4 "$in" > /dev/null 2>&1; then
            cp "$in" "$aligned"
          else
            "$bt/zipalign" -P 16 -f 4 "$in" "$aligned"
          fi
          case "$TAG" in v*) version="${TAG#v}" ;; *) version="dev" ;; esac
          mkdir -p dist
          out="dist/Citadel_${version}_android.apk"
          "$bt/apksigner" sign --ks "$ks" --ks-key-alias citadel --ks-pass env:PASSWORD --key-pass env:PASSWORD --out "$out" "$aligned"
          "$bt/apksigner" verify --print-certs "$out" | grep -q "SHA-256 digest: $APK_CERT_SHA256" || {
            echo "::error::the APK was not signed with the expected release certificate"
            exit 1
          }
          ls -l dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bundle-android
          path: dist/*
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  publish:
    name: publish
    needs: [draft, bundle, sign-android]
    if: ${{ !cancelled() && needs.bundle.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: bundle-*
          path: assets
          merge-multiple: true
      - name: Compute SHA256SUMS
        working-directory: assets
        run: |
          rm -f SHA256SUMS
          sha256sum -- * > ../SHA256SUMS
          mv ../SHA256SUMS SHA256SUMS
          cat SHA256SUMS
      - name: Attach to draft release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          state=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
          if [ "$state" != "true" ]; then
            echo "::error::release $TAG is no longer a draft; refusing to replace its assets"
            exit 1
          fi
          gh release upload "$TAG" assets/* --repo "$GITHUB_REPOSITORY" --clobber
      - name: Upload combined artifact
        if: github.event_name != 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: citadel-dist
          path: assets/
          if-no-files-found: error
          retention-days: 14
          overwrite: true
