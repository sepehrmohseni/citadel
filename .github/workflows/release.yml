name: Release

# Tag push (v*): builds every installer into a draft GitHub release and
# attaches SHA256SUMS. Publish the draft by hand after checking it.
# Manual run (workflow_dispatch): same build matrix, results are uploaded as
# workflow artifacts only; no release is created or touched.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  draft:
    name: draft release
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches app version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(jq -r .version app/src-tauri/tauri.conf.json)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match version $version in app/src-tauri/tauri.conf.json"
            exit 1
          fi
      - name: Create or reuse draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          state=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || true)
          case "$state" in
            true)
              echo "reusing existing draft release $TAG"
              ;;
            false)
              echo "::error::release $TAG is already published; refusing to replace its assets"
              exit 1
              ;;
            *)
              gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft \
                --title "Citadel $TAG" --generate-notes --verify-tag
              ;;
          esac

  bundle:
    name: bundle (${{ matrix.name }})
    needs: draft
    if: ${{ !cancelled() && (needs.draft.result == 'success' || needs.draft.result == 'skipped') }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
            args: --bundles deb,rpm,appimage
          - name: windows-x64
            os: windows-latest
            args: --bundles nsis,msi
          - name: macos-universal
            os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.name }}
      - name: Install frontend dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Build installers
        working-directory: app
        run: pnpm tauri build ${{ matrix.args }} -- --locked
      - name: Collect installers
        run: scripts/collect-bundles.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - name: Attach to draft release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber

  android:
    name: bundle (android)
    needs: draft
    if: ${{ !cancelled() && (needs.draft.result == 'success' || needs.draft.result == 'skipped') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v4
      - name: Signing secrets present
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$PASSWORD" ]; then
            echo "::error::add the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD repository secrets (see docs/INSTALL.md)"
            exit 1
          fi
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-android
      - name: Install frontend dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          dir="$RUNNER_TEMP/signing"
          mkdir -p "$dir"
          printf '%s' "$KEYSTORE" | base64 -d > "$dir/release.jks"
          {
            echo "storeFile=$dir/release.jks"
            echo "password=$PASSWORD"
            echo "keyAlias=citadel"
          } > app/src-tauri/gen/android/keystore.properties
      - name: Build APK
        working-directory: app
        run: pnpm tauri android build --apk --target aarch64 --target armv7 --target x86_64 -- --locked
      - name: Collect APK
        run: |
          version="$(node -p "require('./app/src-tauri/tauri.conf.json').version")"
          mkdir -p dist
          cp app/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk \
            "dist/Citadel_${version}_android.apk"
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-android
          path: dist/*
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - name: Attach to draft release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber

  checksums:
    name: checksums
    needs: [bundle, android]
    if: ${{ !cancelled() && needs.bundle.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Fetch release assets
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir assets
      - name: Fetch workflow artifacts
        if: github.event_name != 'push'
        uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          path: assets
          merge-multiple: true
      - name: Compute SHA256SUMS
        working-directory: assets
        run: |
          rm -f SHA256SUMS
          sha256sum -- * > ../SHA256SUMS
          mv ../SHA256SUMS SHA256SUMS
          cat SHA256SUMS
      - name: Attach SHA256SUMS to draft release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" assets/SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
      - name: Upload combined artifact
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: citadel-dist
          path: assets/
          if-no-files-found: error
          retention-days: 14
          overwrite: true
