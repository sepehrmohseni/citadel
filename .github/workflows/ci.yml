name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: app
        run: |
          if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else pnpm install; fi
      - name: Typecheck
        working-directory: app
        run: pnpm exec tsc --noEmit
      - name: Unit tests
        working-directory: app
        run: pnpm test
      - name: Build
        working-directory: app
        run: pnpm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontend-dist
          path: app/dist
          retention-days: 1

  linux:
    name: clippy + test (linux)
    needs: frontend
    runs-on: ubuntu-24.04
    env:
      CITADEL_SSHD: /usr/sbin/sshd
      CITADEL_SFTP_SERVER: /usr/lib/openssh/sftp-server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: frontend-dist
          path: app/dist
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - name: Clippy
        run: scripts/ci-annotate.sh clippy cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: scripts/ci-annotate.sh tests cargo test --workspace --locked
      - name: OpenSSH suite (release)
        run: scripts/ci-annotate.sh openssh cargo test --release -p citadel-ssh --test openssh --locked -- --nocapture

  e2e:
    name: end-to-end (linux, real sshd)
    needs: frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server xvfb x11-apps x11-utils xdotool x11-xkb-utils libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - name: Install frontend
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Allow the WebKit sandbox to create user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run UI scenario against a throwaway sshd
        run: scripts/ci-annotate.sh e2e app/e2e/ci.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: e2e-screenshots
          path: |
            app/e2e-artifacts/*.png
            app/e2e-artifacts/intl/*.png
            app/e2e-artifacts/features/*.png
          retention-days: 7

  portable:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - name: Build core crates
        shell: bash
        run: scripts/ci-annotate.sh build cargo build --locked -p citadel-ssh -p citadel-telemetry -p citadel-sync
      - name: Test vault and config
        shell: bash
        run: scripts/ci-annotate.sh tests cargo test --locked -p citadel-vault -p citadel-config
